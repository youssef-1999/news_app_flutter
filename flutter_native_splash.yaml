flutter_native_splash:
  # Light mode: black artwork on a white background
  color: "#FFFFFF"
  image: assets/images/dark_mic.png
  branding: assets/images/light_route.png

  # Dark mode: white artwork on a dark background
  color_dark: "#171717"
  image_dark: assets/images/white_mic.png
  branding_dark: assets/images/dark_route.png

  branding_mode: bottom
  branding_bottom_padding: 24

  ios: true
  web: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/dark_mic.png
    branding: assets/images/light_route.png

    color_dark: "#171717"
    image_dark: assets/images/white_mic.png
    branding_dark: assets/images/dark_route.png
